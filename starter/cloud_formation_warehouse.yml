AWSTemplateFormatVersion: '2010-09-09'

Parameters:

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A PUBLIC subnet with a route to an Internet Gateway

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC containing your public subnet

Conditions:
  SingleNode: !Equals [1, 1]

Resources:

  ExternalStorage:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-external-storage-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RedshiftS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-redshift-s3-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: redshift.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RedshiftS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ExternalStorage.Arn
                  - !Sub "${ExternalStorage.Arn}/*"

  RedshiftSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redshift port 5439
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5439
          ToPort: 5439
          CidrIp: 0.0.0.0/0

  RedshiftSubnetGroup:
    Type: AWS::Redshift::ClusterSubnetGroup
    Properties:
      Description: Redshift public subnet group
      SubnetIds:
        - !Ref PublicSubnetId

  RedshiftParameterGroup:
    Type: AWS::Redshift::ClusterParameterGroup
    Properties:
      Description: Airflow lab parameter group
      ParameterGroupFamily: redshift-1.0
      Parameters:
        - ParameterName: require_ssl
          ParameterValue: "true"
        - ParameterName: enable_user_activity_logging
          ParameterValue: "true"

  RedshiftCluster:
    Type: AWS::Redshift::Cluster
    Properties:
      ClusterIdentifier: !Sub "${AWS::StackName}-cluster"
      DBName: "raw"
      MasterUsername: "airflow"
      MasterUserPassword: "Airflow1234!"
      NodeType: ra3.xlplus
      ClusterType: !If [SingleNode, "single-node", "multi-node"]
      NumberOfNodes: 1
      ClusterParameterGroupName: !Ref RedshiftParameterGroup
      IamRoles:
        - !GetAtt RedshiftS3Role.Arn
      VpcSecurityGroupIds:
        - !Ref RedshiftSecurityGroup
      ClusterSubnetGroupName: !Ref RedshiftSubnetGroup
      PubliclyAccessible: true
      Encrypted: true
      AutomatedSnapshotRetentionPeriod: 7

Outputs:

  RedshiftEndpoint:
    Value: !GetAtt RedshiftCluster.Endpoint.Address

  RedshiftPort:
    Value: "5439"

  DatabaseName:
    Value: "raw"

  MasterUsername:
    Value: "airflow"

  MasterUserPassword:
    Value: "Airflow1234!"

  S3BucketName:
    Value: !Ref ExternalStorage

  AWSRegion:
    Value: !Ref AWS::Region